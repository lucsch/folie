[project]
name = "folie"
version = "0.1.0"
description = "Générateur d'index HTML autonome pour répertoires locaux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "typer==0.27.3",
]

[project.scripts]
folie = "folie.cli.main:main"

[project.gui-scripts]
winfolie = "folie.gui.app:main"

[project.optional-dependencies]
gui = ["wxPython>=4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/folie"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
